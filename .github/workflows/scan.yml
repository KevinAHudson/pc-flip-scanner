name: Flip scan
on:
  schedule:
    - cron: "17 11 * * *"   # 7:17 AM ET
    - cron: "47 19 * * *"   # 3:47 PM ET
  workflow_dispatch: {}
permissions:
  contents: write
concurrency: { group: scan, cancel-in-progress: false }
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - name: Install
        run: |
          pip install playwright==1.48.0
          python -m playwright install --with-deps chromium
      - name: Scan
        env:
          NTFY_TOPIC: ${{ secrets.NTFY_TOPIC }}
        run: python -u scanner.py
      - name: Dashboard on run page
        if: always()
        run: test -f summary.md && cat summary.md >> "$GITHUB_STEP_SUMMARY" || echo "no summary" >> "$GITHUB_STEP_SUMMARY"
      - name: Upload report + debug pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: report-${{ github.run_number }}
          path: |
            report.html
            summary.md
            data/latest.json
            debug/
          if-no-files-found: ignore
      - name: Commit results
        if: success()
        run: |
          git config user.name "flip-scanner"
          git config user.email "actions@users.noreply.github.com"
          git add data report.html summary.md
          git diff --cached --quiet || git commit -m "scan $(date -u +%F_%H%M)"
          git push
